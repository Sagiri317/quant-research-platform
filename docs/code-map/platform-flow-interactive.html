<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>平台接口与核心流向交互图</title>
  <style>
    :root {
      --bg: #f5f2ea;
      --ink: #18211f;
      --muted: #5f6a64;
      --line: #a8b0a9;
      --panel: #fffdf7;
      --panel-2: #ece7dc;
      --accent: #0f7f77;
      --accent-2: #b6422d;
      --done: #0d6f65;
      --todo: #9a4936;
      --shadow: 0 18px 45px rgba(37, 40, 36, 0.12);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(24, 33, 31, 0.035) 1px, transparent 1px),
        linear-gradient(rgba(24, 33, 31, 0.035) 1px, transparent 1px),
        var(--bg);
      background-size: 24px 24px;
      color: var(--ink);
      font-family: "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: 1fr 360px;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(24, 33, 31, 0.12);
      background: rgba(255, 253, 247, 0.92);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      border: 1px solid rgba(24, 33, 31, 0.18);
      background: var(--panel);
      color: var(--ink);
      min-height: 34px;
      padding: 7px 12px;
      border-radius: 6px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover {
      border-color: rgba(15, 127, 119, 0.55);
      color: var(--accent);
    }

    button.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .canvas-shell {
      position: relative;
      min-width: 0;
      overflow: hidden;
    }

    .toolbar {
      position: absolute;
      z-index: 4;
      top: 16px;
      left: 16px;
      display: flex;
      gap: 8px;
      padding: 8px;
      border: 1px solid rgba(24, 33, 31, 0.12);
      border-radius: var(--radius);
      background: rgba(255, 253, 247, 0.9);
      box-shadow: var(--shadow);
    }

    .toolbar button {
      min-width: 34px;
      padding: 6px 9px;
    }

    .legend {
      position: absolute;
      z-index: 4;
      left: 16px;
      bottom: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 9px 11px;
      border: 1px solid rgba(24, 33, 31, 0.12);
      border-radius: var(--radius);
      background: rgba(255, 253, 247, 0.92);
      color: var(--muted);
      font-size: 12px;
      box-shadow: var(--shadow);
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .sample-line {
      width: 28px;
      height: 0;
      border-top: 2px solid var(--done);
    }

    .sample-line.todo {
      border-top: 2px dashed var(--todo);
    }

    svg {
      width: 100%;
      height: calc(100vh - 64px);
      display: block;
      cursor: grab;
      user-select: none;
    }

    svg.dragging {
      cursor: grabbing;
    }

    .edge {
      fill: none;
      stroke: var(--done);
      stroke-width: 2.2;
      marker-end: url(#arrowDone);
      cursor: pointer;
    }

    .edge.todo {
      stroke: var(--todo);
      stroke-dasharray: 8 7;
      marker-end: url(#arrowTodo);
    }

    .edge:hover {
      stroke-width: 3.2;
    }

    .edge.core {
      stroke-width: 3.3;
    }

    .node {
      cursor: move;
    }

    .node rect {
      fill: var(--panel);
      stroke: rgba(24, 33, 31, 0.18);
      stroke-width: 1.2;
      rx: 8;
      filter: drop-shadow(0 10px 14px rgba(37, 40, 36, 0.10));
    }

    .node.done rect {
      stroke: rgba(13, 111, 101, 0.5);
    }

    .node.core rect {
      fill: #e8f6f2;
      stroke: rgba(13, 111, 101, 0.82);
      stroke-width: 2.2;
    }

    .node.todo rect {
      stroke: rgba(154, 73, 54, 0.55);
      fill: #fff7f1;
    }

    .node.selected rect {
      stroke-width: 2.4;
      stroke: var(--accent);
    }

    .node-title {
      fill: var(--ink);
      font-size: 13px;
      font-weight: 700;
      pointer-events: none;
    }

    .node-kind {
      fill: var(--muted);
      font-size: 11px;
      pointer-events: none;
    }

    aside {
      min-width: 0;
      border-left: 1px solid rgba(24, 33, 31, 0.12);
      background: rgba(255, 253, 247, 0.94);
      padding: 18px;
      overflow: auto;
      height: calc(100vh - 64px);
    }

    .detail-card {
      border: 1px solid rgba(24, 33, 31, 0.12);
      border-radius: var(--radius);
      background: var(--panel);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }

    .detail-card h2 {
      margin: 10px 0 8px;
      font-size: 20px;
      line-height: 1.25;
    }

    .detail-card p {
      margin: 8px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .meta {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .meta-row {
      padding: 9px 10px;
      border-radius: 6px;
      background: var(--panel-2);
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .meta-row strong {
      display: block;
      margin-bottom: 3px;
      color: var(--ink);
    }

    .notes {
      margin-top: 16px;
      display: grid;
      gap: 8px;
    }

    .note {
      border-left: 3px solid var(--accent);
      padding: 8px 10px;
      background: rgba(15, 127, 119, 0.07);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 960px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 58vh auto;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .tabs {
        justify-content: flex-start;
      }

      svg {
        height: 58vh;
      }

      aside {
        border-left: 0;
        border-top: 1px solid rgba(24, 33, 31, 0.12);
        height: auto;
        max-height: none;
      }
    }
  </style>
</head>

    const svg = document.getElementById('graph');

    const viewNotes = document.getElementById('viewNotes');

    let activeView = 'platform';
    let selected = null;
    let scale = 0.42;
    let pan = { x: 34, y: 94 };
    let dragNode = null;
    let panStart = null;

    Object.entries(views).forEach(([key, view]) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = view.title;
      btn.dataset.view = key;
      btn.addEventListener('click', () => switchView(key));
      tabs.appendChild(btn);
    });

    document.getElementById('zoomIn').addEventListener('click', () => zoomBy(1.15));
    document.getElementById('zoomOut').addEventListener('click', () => zoomBy(0.87));
    document.getElementById('resetView').addEventListener('click', () => resetView());

    svg.addEventListener('wheel', (event) => {
      event.preventDefault();
      const factor = event.deltaY < 0 ? 1.1 : 0.9;
      const before = screenToWorld(event.clientX, event.clientY);
      scale = clamp(scale * factor, 0.18, 1.8);
      const after = screenToWorld(event.clientX, event.clientY);
      pan.x += (after.x - before.x) * scale;
      pan.y += (after.y - before.y) * scale;
      updateTransform();
    }, { passive: false });

    svg.addEventListener('pointerdown', (event) => {
      if (event.target.closest && event.target.closest('.node')) return;
      svg.setPointerCapture(event.pointerId);
      panStart = { x: event.clientX, y: event.clientY, panX: pan.x, panY: pan.y };
      svg.classList.add('dragging');
    });

    svg.addEventListener('pointermove', (event) => {
      if (dragNode) {
        const world = screenToWorld(event.clientX, event.clientY);
        dragNode.node.x = world.x - dragNode.offsetX;
        dragNode.node.y = world.y - dragNode.offsetY;
        draw();
        return;
      }
      if (panStart) {
        pan.x = panStart.panX + event.clientX - panStart.x;
        pan.y = panStart.panY + event.clientY - panStart.y;
        updateTransform();
      }
    });

    svg.addEventListener('pointerup', (event) => {
      if (dragNode) {
        dragNode = null;
      }
      if (panStart) {
        panStart = null;
        svg.classList.remove('dragging');
      }
      try {
        svg.releasePointerCapture(event.pointerId);
      } catch (_) {
        // Ignore if the pointer was captured by a node.
      }
    });

    function switchView(key) {
      activeView = key;
      selected = null;
      resetView(false);
      draw();
      showDefaultDetail();
      document.querySelectorAll('.tabs button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === key);
      });
      viewNotes.innerHTML = '';
      views[key].notes.forEach(text => {
        const div = document.createElement('div');
        div.className = 'note';
        div.textContent = text;
        viewNotes.appendChild(div);
      });
    }

    function resetView(redraw = true) {
      const view = views[activeView];
      const maxX = Math.max(...view.nodes.map(node => node.x + node.w), 1000);
      const minX = Math.min(...view.nodes.map(node => node.x), 0);
      const width = Math.max(1, maxX - minX);
      const svgWidth = svg.clientWidth || 1200;
      scale = clamp((svgWidth - 120) / width, 0.2, 0.9);
      pan = { x: 48 - minX * scale, y: 105 };
      updateTransform();
      if (redraw) draw();
    }

    function zoomBy(factor) {
      scale = clamp(scale * factor, 0.18, 1.8);
      updateTransform();
    }

    function updateTransform() {
      viewport.setAttribute('transform', `translate(${pan.x} ${pan.y}) scale(${scale})`);
    }

    function draw() {
      edgeLayer.innerHTML = '';
      nodeLayer.innerHTML = '';
      const view = views[activeView];
      const nodeMap = new Map(view.nodes.map(node => [node.id, node]));

      view.edges.forEach((edge, index) => {
        const from = nodeMap.get(edge.from);
        const to = nodeMap.get(edge.to);
        if (!from || !to) return;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const start = anchor(from, to);
        const end = anchor(to, from);
        const midX = (start.x + end.x) / 2;
        const curve = Math.max(40, Math.abs(end.x - start.x) * 0.25);
        path.setAttribute('d', `M ${start.x} ${start.y} C ${start.x + curve} ${start.y}, ${end.x - curve} ${end.y}, ${end.x} ${end.y}`);
        path.setAttribute('class', `edge ${edge.status === 'todo' ? 'todo' : ''} ${isCoreEdge(edge) ? 'core' : ''}`);
        path.dataset.edgeIndex = index;
        path.addEventListener('click', (event) => {
          event.stopPropagation();
          selected = { type: 'edge', edge };
          showEdge(edge, from, to);
        });
        edgeLayer.appendChild(path);
      });

      view.nodes.forEach(node => {
        const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        group.setAttribute('class', `node ${node.status} ${isCoreNode(node) ? 'core' : ''} ${selected?.node?.id === node.id ? 'selected' : ''}`);
        group.setAttribute('transform', `translate(${node.x} ${node.y})`);
        group.dataset.nodeId = node.id;

        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('width', node.w);
        rect.setAttribute('height', node.h);
        group.appendChild(rect);

        const kind = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        kind.setAttribute('class', 'node-kind');
        kind.setAttribute('x', 14);
        kind.setAttribute('y', 20);
        kind.textContent = `${node.kind} · ${node.status === 'todo' ? '待实现' : '已实现'}`;
        group.appendChild(kind);

        const title = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        title.setAttribute('class', 'node-title');
        title.setAttribute('x', 14);
        title.setAttribute('y', 42);
        wrapText(title, node.label, node.w - 28, 16);
        group.appendChild(title);

        group.addEventListener('pointerdown', (event) => {
          event.stopPropagation();
          svg.setPointerCapture(event.pointerId);
          const world = screenToWorld(event.clientX, event.clientY);
          dragNode = {
            node,
            offsetX: world.x - node.x,
            offsetY: world.y - node.y
          };
          selected = { type: 'node', node };
          showNode(node);
          draw();
        });

        group.addEventListener('click', (event) => {
          event.stopPropagation();
          selected = { type: 'node', node };
          showNode(node);
          draw();
        });

        nodeLayer.appendChild(group);
      });
    }

    function anchor(from, to) {
      const cx = from.x + from.w / 2;
      const cy = from.y + from.h / 2;
      const tx = to.x + to.w / 2;
      const ty = to.y + to.h / 2;
      if (Math.abs(tx - cx) >= Math.abs(ty - cy)) {
        return {
          x: tx >= cx ? from.x + from.w : from.x,
          y: cy
        };
      }
      return {
        x: cx,
        y: ty >= cy ? from.y + from.h : from.y
      };
    }

    function isCoreNode(node) {
      return activeView === 'platform' && PLATFORM_CORE_NODE_IDS.has(node.id);
    }

    function isCoreEdge(edge) {
      return (
        activeView === 'platform' &&
        PLATFORM_CORE_EDGE_KEYS.has(`${edge.from}->${edge.to}`)
      );
    }

    function wrapText(textElement, text, maxWidth, lineHeight) {
      const words = splitLabel(text);
      let line = '';
      let y = Number(textElement.getAttribute('y'));
      let tspan = newTspan(textElement, y);
      words.forEach(word => {
        const test = line ? `${line}${word}` : word;
        tspan.textContent = test;
        if (tspan.getComputedTextLength() > maxWidth && line) {
          tspan.textContent = line;
          line = word;
          y += lineHeight;
          tspan = newTspan(textElement, y);
          tspan.textContent = word;
        } else {
          line = test;
        }
      });
    }

    function splitLabel(text) {
      if (/[\u4e00-\u9fa5]/.test(text)) {
        return Array.from(text);
      }
      return text
        .split(/([\s_\/-]+)/)
        .flatMap(part => part.length > 18 ? part.match(/.{1,12}/g) : [part])
        .filter(Boolean);
    }

    function newTspan(textElement, y) {
      const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
      tspan.setAttribute('x', textElement.getAttribute('x'));
      tspan.setAttribute('y', y);
      textElement.appendChild(tspan);
      return tspan;
    }

    function screenToWorld(clientX, clientY) {
      const rect = svg.getBoundingClientRect();
      return {
        x: (clientX - rect.left - pan.x) / scale,
        y: (clientY - rect.top - pan.y) / scale
      };
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function showDefaultDetail() {
      const view = views[activeView];
      detail.innerHTML = `
        <div class="eyebrow">当前视图</div>
        <h2>${escapeHtml(view.title)}</h2>
        <p>${escapeHtml(view.subtitle)}</p>
        <div class="meta">
          <div class="meta-row"><strong>操作</strong>拖动节点调整布局；滚轮缩放；拖拽空白处平移；点击节点或边查看说明。</div>
          <div class="meta-row"><strong>状态</strong>实线为已实现，虚线为待实现或待验证。</div>
        </div>
      `;
    }

    function showNode(node) {
      const usage = NODE_USAGE[node.id];
      detail.innerHTML = `
        <div class="eyebrow">${isCoreNode(node) ? 'A股核心主链路 · ' : ''}${node.status === 'todo' ? '待实现节点' : '已实现节点'}</div>
        <h2>${escapeHtml(node.label)}</h2>
        <p>${escapeHtml(node.desc)}</p>
        <div class="meta">
          <div class="meta-row"><strong>类型</strong>${escapeHtml(node.kind)}</div>
          <div class="meta-row"><strong>代码或位置</strong>${escapeHtml(node.path)}</div>
          <div class="meta-row"><strong>节点 ID</strong>${escapeHtml(node.id)}</div>
          ${usage ? `<div class="meta-row"><strong>${escapeHtml(usage.title)}</strong>${escapeHtml(usage.body)}</div>` : ''}
          ${usage ? `<div class="meta-row"><strong>关键参数</strong>${escapeHtml(usage.params)}</div>` : ''}
        </div>
      `;
    }

    function showEdge(edge, from, to) {
      detail.innerHTML = `
        <div class="eyebrow">${isCoreEdge(edge) ? 'A股核心主链路 · ' : ''}${edge.status === 'todo' ? '待实现边' : '已实现边'}</div>
        <h2>${escapeHtml(from.label)} → ${escapeHtml(to.label)}</h2>
        <p>${escapeHtml(edge.label)}</p>
        <div class="meta">
          <div class="meta-row"><strong>起点</strong>${escapeHtml(from.label)}</div>
          <div class="meta-row"><strong>终点</strong>${escapeHtml(to.label)}</div>
          <div class="meta-row"><strong>状态</strong>${edge.status === 'todo' ? '待实现或待验证' : '已实现'}</div>
        </div>
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    window.addEventListener('resize', () => updateTransform());
    switchView('platform');
  </script>
</body>
</html>
