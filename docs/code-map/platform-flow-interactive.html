<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quant Research Platform Code Map</title>
  <style>
    :root {
      --bg: #f7f9fb;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #5f6b7a;
      --line: #d9e1ea;
      --green: #0d6f65;
      --blue: #2f68b1;
      --amber: #a8660a;
      --purple: #7056b8;
      --red: #b33a3a;
      --shadow: 0 10px 26px rgba(23, 32, 42, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.5 "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .subtitle { color: var(--muted); margin: 0; }
    .layout {
      display: grid;
      grid-template-columns: minmax(720px, 1fr) 430px;
      min-height: calc(100vh - 75px);
    }
    .canvas-wrap {
      position: relative;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background:
        linear-gradient(rgba(23, 32, 42, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 32, 42, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .toolbar {
      position: absolute;
      z-index: 5;
      left: 14px;
      top: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      max-width: calc(100% - 28px);
    }
    button, select, input {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 6px;
      padding: 7px 10px;
      font: inherit;
      box-shadow: 0 1px 2px rgba(23, 32, 42, 0.05);
    }
    button { cursor: pointer; }
    input { width: 230px; }
    svg { width: 100%; height: 100%; display: block; }
    .edge {
      stroke: #7b8794;
      stroke-width: 2;
      fill: none;
      marker-end: url(#arrow);
      opacity: 0.86;
      cursor: pointer;
    }
    .edge.active { stroke: var(--red); stroke-width: 4; opacity: 1; }
    .node rect {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 1.5;
      rx: 8;
      filter: drop-shadow(0 4px 8px rgba(23, 32, 42, 0.12));
    }
    .node text { pointer-events: none; }
    .node .id { font-size: 11px; fill: var(--muted); }
    .node .label { font-size: 13px; font-weight: 700; fill: var(--ink); }
    .node.active rect { stroke: var(--red); stroke-width: 3; }
    .node[data-group="a_share"] rect { stroke: var(--green); }
    .node[data-group="evaluation"] rect { stroke: var(--blue); }
    .node[data-group="api"] rect { stroke: var(--purple); }
    .node[data-group="frontend"] rect { stroke: #377f9d; }
    .node[data-group="pipeline"] rect { stroke: var(--amber); }
    .node[data-group="factory"] rect { stroke: #8f5d24; }
    .node[data-group="cli"] rect { stroke: #59636f; }
    aside {
      overflow: auto;
      padding: 18px;
      background: var(--panel);
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 2px 6px rgba(23, 32, 42, 0.04);
    }
    .card h2 { font-size: 18px; margin: 0 0 8px; }
    .card h3 { font-size: 15px; margin: 14px 0 6px; }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }
    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      color: var(--muted);
      background: #f8fafc;
      font-size: 12px;
    }
    code { background: #f1f5f9; padding: 1px 4px; border-radius: 4px; }
    ul { padding-left: 18px; }
    .list-item {
      padding: 7px 0;
      border-bottom: 1px solid #edf1f5;
      cursor: pointer;
    }
    .list-item:last-child { border-bottom: 0; }
    .list-item strong { display: block; }
    .muted { color: var(--muted); }
    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; }
      .canvas-wrap { height: 760px; border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Quant Research Platform Code Map</h1>
    <p class="subtitle">当前 Phase 1 代码事实：A 股数据链路、evaluation artifacts、API/download/frontend、processed-existing runner 和 Factor Factory。</p>
  </header>
  <main class="layout">
    <section class="canvas-wrap" id="canvasWrap">
      <div class="toolbar">
        <select id="groupFilter" aria-label="分组筛选">
          <option value="all">全部分组</option>
          <option value="a_share">A 股数据</option>
          <option value="evaluation">Evaluation / Artifacts</option>
          <option value="api">API</option>
          <option value="frontend">Frontend</option>
          <option value="pipeline">Pipeline</option>
          <option value="factory">Factor Factory</option>
          <option value="cli">CLI</option>
        </select>
        <input id="searchBox" placeholder="搜索节点、边、文件或入口" />
        <button id="resetBtn" type="button">重置视图</button>
      </div>
      <svg id="map" viewBox="0 0 1600 1120" role="img" aria-label="Quant Research Platform code map">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8794"></path>
          </marker>
        </defs>
        <g id="viewport"></g>
      </svg>
    </section>
    <aside>
      <div class="card" id="detail">
        <h2>选择节点或边</h2>
        <p class="muted">点击图中节点或边查看功能、状态、代码位置和边界说明。也可以用搜索框过滤。</p>
      </div>
      <div class="card">
        <h2>节点索引</h2>
        <div id="nodeList"></div>
      </div>
      <div class="card">
        <h2>边索引</h2>
        <div id="edgeList"></div>
      </div>
    </aside>
  </main>
  <script>
    const nodes = [
      n("N01","CSMAR raw CSV","a_share","已实现私有输入","data/raw_private/csmar/","用户手工导出的 CSMAR 原始文件；不提交、不公开、不自动下载。",80,80),
      n("N02","build_interim CLI","a_share","已实现入口","markets/implementations/a_share/csmar/build_interim.py","标准化 raw CSV，写出 interim CSV。",290,80),
      n("N03","interim CSV","a_share","已实现私有产物","data/interim_private/csmar/","可审计中间层，供 panel builder 读取。",500,80),
      n("N04","build_panel CLI","a_share","已实现入口","markets/implementations/a_share/datasets/build_panel.py","从 interim yearly CSV 构建 full research panel。",710,80),
      n("N05","build_panel_full_from_interim","a_share","已实现函数","datasets/build_panel.py","合并行情、基础信息、市值并生成 universe/tradability 列。",930,80),
      n("N06","research panel Parquet","a_share","已实现私有产物","data/processed_private/csmar/panel_full/","宽表研究面板，供 factor builder 读取。",1190,80),
      n("N07","build_factors CLI","a_share","已实现入口","markets/implementations/a_share/factors/build_factors.py","从 panel 生成 slim factor and label table。",80,250),
      n("N08","calculate_price_volume_factor_full","a_share","已实现函数","factors/build_factors.py","计算 price-volume factors 和 forward labels。",320,250),
      n("N09","factor and label Parquet","a_share","已实现私有产物","data/processed_private/csmar/price_volume_factors_full/","A 股 adapter、runner 和 Factor Factory 的主要输入。",610,250),
      n("N10","A 股 run_factor_evaluation CLI","a_share","已实现入口","evaluation/run_factor_evaluation.py","按年份定位 factor file，按日期过滤 trade_date。",900,250),
      n("N11","run_processed_factor_evaluation","a_share","已实现编排","evaluation/evaluation_adapter.py","覆盖文件选择、label availability、逐 label evaluation run。",1190,250),
      n("N12","read_evaluation_frame / read_factor_frame","a_share","已实现读取","evaluation/evaluation_adapter.py","读取所需列并保留 factor、label、PnL、risk、tradability。",80,420),
      n("N13","EvaluationSpec","evaluation","已实现 public contract","evaluations/evaluation_spec.py","统一 evaluation 输入合同。",380,420),
      n("N14","evaluate_to_payload","evaluation","已实现内部边界","evaluations/evaluation_runner.py","纯计算 payload，不写 artifacts。",610,420),
      n("N15","run_evaluation","evaluation","已实现 public entrypoint","evaluations/evaluation_runner.py","对外稳定入口，连接 payload 和 writer。",850,420),
      n("N16","DataFrame / Tensor kernels","evaluation","已实现计算路径","kernels/dataframe/, kernels/tensor/","数值计算实现，不依赖 API 或 market module。",1070,420),
      n("N17","write_evaluation_set_artifacts","evaluation","已实现 writer","artifacts/artifact_writer.py","写 schema 0.5 evaluation-set artifacts。",1320,420),
      n("N18","EvaluationSetResult","evaluation","已实现结果对象","evaluations/evaluation_result.py","run_evaluation 返回对象。",80,590),
      n("N19","schema 0.5 run directory","evaluation","已实现产物合同","reports/private_real/factor_evaluation/, reports/runs/","completed evaluation-set artifacts。",330,590),
      n("N20","manifest.display","evaluation","已实现展示合同","artifacts/display_manifest.py, manifest_validation.py","API、downloads、CSV preview、charts、frontend 的唯一展示合同。",600,590),
      n("N21","load_evaluation_set","evaluation","已实现 loader","artifacts/artifact_loader.py","严格读取 schema 0.5 artifacts。",850,590),
      n("N22","run_repository","api","已实现 service","interfaces/api/services/run_repository.py","run roots、source_alias + run_id、loader wrapper、受控删除。",1080,590),
      n("N23","FastAPI create_app","api","已实现本地 app","interfaces/api/app.py","配置 app state 并注册 routers。",1320,590),
      n("N24","runs/evidence/table APIs","api","已实现 routes","routes/runs.py, routes/artifacts.py","run list、evidence、table preview、artifact route。",80,760),
      n("N25","direct/ZIP downloads","api","已实现 artifact/API 边界","artifacts/artifact_package.py, routes/downloads.py, services/download_service.py","只下载 manifest.display 暴露项；ZIP packaging 规则在 artifacts 层。",330,760),
      n("N26","comparison APIs","api","已实现 routes/services","routes/comparison.py, services/comparison_service.py","API-visible runs comparison。",590,760),
      n("N27","CSV upload API","api","保留入口","routes/uploads.py, services/upload_service.py","factor CSV template 与本地 CSV upload；不是 A 股主流程。",820,760),
      n("N28","React workbench","frontend","已实现前端入口","web/src/App.tsx","本地 evidence workbench，只消费 API。",1070,760),
      n("N29","ArtifactDownloads","frontend","已实现下载 UI","web/src/ArtifactDownloads.tsx","display-driven direct/ZIP download。",1320,760),
      n("N30","Factor Studio","frontend","已实现前端入口","web/src/FactorStudio.tsx","受控 factor draft。",80,930),
      n("N31","Pipeline Builder","frontend","已实现前端入口","web/src/PipelineBuilder.tsx","当前 UI 提交 snapshot；后端同一 API 支持 processed-existing。",300,930),
      n("N32","POST /api/pipeline-runs","pipeline","已实现 API","routes/pipeline.py, services/pipeline_service.py","支持 snapshot 和 processed_existing。",540,930),
      n("N33","pipeline snapshot","pipeline","已实现产物","reports/private_real/pipeline_runs/","run_config.yaml、warnings.json、summary.md。",780,930),
      n("N34","processed-existing runner","pipeline","已实现轻量模式","pipelines/a_share/runner.py","调用 A 股 adapter，不重建 raw/interim/panel/factors。",1020,930),
      n("N35","Factor template registry","factory","已实现 registry","research/factor_factory/factor_registry.py","受控 templates、inputs、outputs、capabilities。",1260,930),
      n("N36","Factor Factory batch runner","factory","已实现第一版","research/factor_factory/batch_runner.py","批量调用 processed-existing runner。",80,1070),
      n("N37","Factor Factory artifacts","factory","已实现 artifact 0.1","research/factor_factory/reports.py","candidate_summary、failed_candidates、manifest.display。",330,1070),
      n("N38","Factor Factory APIs","factory","已实现 routes","routes/factor_factory.py","浏览和下载 Factor Factory display artifacts。",590,1070),
      n("N39","qrp CLI","cli","已实现入口","interfaces/cli/commands.py","evaluate-parquet、compare、a-share help commands。",850,1070),
      n("N40","write_run_comparison","cli","已实现离线比较","artifacts/artifact_comparison.py","qrp compare 的离线 comparison writer。",1080,1070)
    ];

    const edges = [
      e("E01","N01","N02","raw CSV 进入 build_interim；代码不自动下载或登录 CSMAR。"),
      e("E02","N02","N03","build_interim 写出标准化 interim CSV。"),
      e("E03","N03","N04","panel builder 读取 interim，不直接读 raw。"),
      e("E04","N04","N05","CLI 调用函数级 panel builder。"),
      e("E05","N05","N06","写出 full research panel 和 tradability 列。"),
      e("E06","N06","N07","factor CLI 读取 full panel。"),
      e("E07","N07","N08","按 windows/horizons 调用 factor builder。"),
      e("E08","N08","N09","写 slim factor and label Parquet。"),
      e("E09","N09","N10","A 股评估入口读取 processed factor table。"),
      e("E10","N10","N11","CLI 参数进入 A 股 adapter 编排。"),
      e("E11","N11","N12","adapter 定位覆盖文件并读取 evaluation frame。"),
      e("E12","N12","N13","构造 EvaluationSpec，保留 A 股 metadata。"),
      e("E13","N13","N15","所有 adapter 最终进入 run_evaluation。"),
      e("E14","N15","N14","run_evaluation 先生成纯计算 payload。"),
      e("E15","N14","N16","payload 计算阶段调用 kernels。"),
      e("E16","N16","N14","kernels 返回表格、summary 和 report 输入。"),
      e("E17","N14","N17","writer 消费结构化 payload。"),
      e("E18","N15","N17","public entrypoint 连接计算和写盘。"),
      e("E19","N17","N19","写 schema 0.5 artifact directory。"),
      e("E20","N17","N18","返回 EvaluationSetResult。"),
      e("E21","N19","N20","manifest.json 中的 display 成为展示合同。"),
      e("E22","N19","N21","loader 严格读取 completed run。"),
      e("E23","N21","N22","repository 通过 loader 建立 run index。"),
      e("E24","N22","N23","app state 注入 run roots 和 services。"),
      e("E25","N20","N24","evidence/table API 只暴露 display tables。"),
      e("E26","N20","N25","download API 只暴露 display download items。"),
      e("E27","N23","N24","FastAPI 注册 runs/artifacts routes。"),
      e("E28","N23","N25","FastAPI 注册 download routes。"),
      e("E29","N23","N26","FastAPI 注册 comparison routes。"),
      e("E30","N23","N27","CSV upload 保留入口。","保留入口"),
      e("E31","N27","N13","upload service 构造 EvaluationSpec。"),
      e("E32","N24","N28","React workbench 获取 runs/evidence/table payload。"),
      e("E33","N25","N29","ArtifactDownloads 调用 direct/ZIP endpoints。"),
      e("E34","N28","N29","download UI 随 run/combination state 更新。"),
      e("E35","N30","N31","Factor draft 传入 Pipeline Builder。"),
      e("E36","N35","N30","template registry 供 Factor Studio 展示。"),
      e("E37","N31","N32","Pipeline Builder 提交 pipeline request。"),
      e("E38","N32","N33","snapshot 模式写配置快照。"),
      e("E39","N32","N34","processed_existing 模式调用轻量 runner。","已实现轻量模式"),
      e("E40","N34","N11","runner 调用 A 股 adapter，不绕过 market module。","已实现轻量模式"),
      e("E41","N35","N36","registry 展开 Factor Factory candidates。"),
      e("E42","N36","N34","batch runner 逐 candidate 调用 runner。","已实现轻量模式"),
      e("E43","N36","N37","写 candidate summary 和 failed candidate log。"),
      e("E44","N37","N38","Factor Factory API 读取 display artifacts。"),
      e("E45","N38","N28","workbench 浏览 Factor Factory results。"),
      e("E46","N39","N10","qrp a-share evaluate 是帮助/跳转入口。","已实现入口"),
      e("E47","N39","N13","qrp evaluate-parquet 构造 EvaluationSpec。"),
      e("E48","N39","N40","qrp compare 调用离线 comparison writer。"),
      e("E49","N40","N19","comparison writer 读取 completed run directory。")
    ];

    function n(id,label,group,status,path,description,x,y){ return {id,label,group,status,path,description,x,y}; }
    function e(id,from,to,description,status="已实现"){ return {id,from,to,description,status}; }

    const viewport = document.getElementById("viewport");
    const detail = document.getElementById("detail");
    const nodeList = document.getElementById("nodeList");
    const edgeList = document.getElementById("edgeList");
    const groupFilter = document.getElementById("groupFilter");
    const searchBox = document.getElementById("searchBox");
    const resetBtn = document.getElementById("resetBtn");
    let activeId = null;
    let pan = {x: 0, y: 0};
    let zoom = 1;
    let drag = null;

    function render() {
      viewport.innerHTML = "";
      viewport.setAttribute("transform", `translate(${pan.x} ${pan.y}) scale(${zoom})`);
      const visible = visibleNodes();
      const visibleIds = new Set(visible.map(node => node.id));
      for (const edge of edges) {
        if (!visibleIds.has(edge.from) || !visibleIds.has(edge.to)) continue;
        const from = nodes.find(node => node.id === edge.from);
        const to = nodes.find(node => node.id === edge.to);
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        const x1 = from.x + 170, y1 = from.y + 34, x2 = to.x, y2 = to.y + 34;
        const mx = (x1 + x2) / 2;
        path.setAttribute("d", `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
        path.setAttribute("class", `edge ${activeId === edge.id ? "active" : ""}`);
        path.addEventListener("click", event => { event.stopPropagation(); selectEdge(edge.id); });
        viewport.appendChild(path);
      }
      for (const node of visible) {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", `node ${activeId === node.id ? "active" : ""}`);
        g.setAttribute("data-group", node.group);
        g.setAttribute("transform", `translate(${node.x} ${node.y})`);
        g.addEventListener("click", event => { event.stopPropagation(); selectNode(node.id); });
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("width", "180");
        rect.setAttribute("height", "70");
        const idText = text(12, 19, node.id, "id");
        const labelText = text(12, 41, node.label.length > 22 ? node.label.slice(0, 21) + "..." : node.label, "label");
        const statusText = text(12, 60, node.status, "id");
        g.append(rect, idText, labelText, statusText);
        viewport.appendChild(g);
      }
      renderLists();
    }

    function text(x,y,value,cls){
      const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t.setAttribute("x", x);
      t.setAttribute("y", y);
      t.setAttribute("class", cls);
      t.textContent = value;
      return t;
    }

    function visibleNodes() {
      const group = groupFilter.value;
      const q = searchBox.value.trim().toLowerCase();
      return nodes.filter(node => {
        const groupOk = group === "all" || node.group === group;
        const textOk = !q || [node.id,node.label,node.group,node.status,node.path,node.description].join(" ").toLowerCase().includes(q);
        return groupOk && textOk;
      });
    }

    function renderLists() {
      const visible = visibleNodes();
      const visibleIds = new Set(visible.map(node => node.id));
      nodeList.innerHTML = visible.map(node => `<div class="list-item" data-node="${node.id}"><strong>${node.id} ${node.label}</strong><span class="muted">${node.path}</span></div>`).join("");
      edgeList.innerHTML = edges
        .filter(edge => visibleIds.has(edge.from) && visibleIds.has(edge.to))
        .map(edge => `<div class="list-item" data-edge="${edge.id}"><strong>${edge.id} ${edge.from} -> ${edge.to}</strong><span class="muted">${edge.status} · ${edge.description}</span></div>`)
        .join("");
      nodeList.querySelectorAll("[data-node]").forEach(el => el.addEventListener("click", () => selectNode(el.dataset.node)));
      edgeList.querySelectorAll("[data-edge]").forEach(el => el.addEventListener("click", () => selectEdge(el.dataset.edge)));
    }

    function selectNode(id) {
      activeId = id;
      const node = nodes.find(item => item.id === id);
      detail.innerHTML = `
        <div class="meta"><span class="tag">${node.id}</span><span class="tag">${node.group}</span><span class="tag">${node.status}</span></div>
        <h2>${node.label}</h2>
        <p>${node.description}</p>
        <h3>代码位置</h3>
        <p><code>${node.path}</code></p>
        <h3>相关边</h3>
        <ul>${edges.filter(edge => edge.from === id || edge.to === id).map(edge => `<li><button type="button" data-edge="${edge.id}">${edge.id}</button> ${edge.from} -> ${edge.to}: ${edge.description}</li>`).join("")}</ul>
      `;
      detail.querySelectorAll("[data-edge]").forEach(el => el.addEventListener("click", () => selectEdge(el.dataset.edge)));
      render();
    }

    function selectEdge(id) {
      activeId = id;
      const edge = edges.find(item => item.id === id);
      const from = nodes.find(node => node.id === edge.from);
      const to = nodes.find(node => node.id === edge.to);
      detail.innerHTML = `
        <div class="meta"><span class="tag">${edge.id}</span><span class="tag">${edge.status}</span></div>
        <h2>${from.label} -> ${to.label}</h2>
        <p>${edge.description}</p>
        <h3>From</h3>
        <p><button type="button" data-node="${from.id}">${from.id}</button> <code>${from.path}</code></p>
        <h3>To</h3>
        <p><button type="button" data-node="${to.id}">${to.id}</button> <code>${to.path}</code></p>
      `;
      detail.querySelectorAll("[data-node]").forEach(el => el.addEventListener("click", () => selectNode(el.dataset.node)));
      render();
    }

    document.getElementById("map").addEventListener("wheel", event => {
      event.preventDefault();
      zoom = Math.max(0.55, Math.min(1.8, zoom + (event.deltaY < 0 ? 0.08 : -0.08)));
      render();
    }, {passive:false});
    document.getElementById("map").addEventListener("pointerdown", event => {
      drag = {x:event.clientX, y:event.clientY, panX:pan.x, panY:pan.y};
    });
    window.addEventListener("pointermove", event => {
      if (!drag) return;
      pan = {x: drag.panX + event.clientX - drag.x, y: drag.panY + event.clientY - drag.y};
      render();
    });
    window.addEventListener("pointerup", () => { drag = null; });
    groupFilter.addEventListener("change", render);
    searchBox.addEventListener("input", render);
    resetBtn.addEventListener("click", () => { pan = {x:0,y:0}; zoom = 1; searchBox.value = ""; groupFilter.value = "all"; activeId = null; render(); });
    render();
  </script>
</body>
</html>
