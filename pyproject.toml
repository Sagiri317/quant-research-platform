[project]
name = "quant-research-platform"
version = "0.1.0"
description = "Local multi-market quantitative research platform."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "numpy",
  "pandas",
  "pyarrow",
  "pydantic",
  "pytest",
  "ruff",
  "scikit-learn",
  "typer",
  "uvicorn",
]

[project.scripts]
qrp = "quant_research_platform.interfaces.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
