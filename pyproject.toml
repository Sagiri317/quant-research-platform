[project]
name = "a-share-alpha-lab"
version = "0.1.0"
description = "Private CSMAR A-share factor research lab."
requires-python = ">=3.11"
dependencies = [
  "pandas",
  "pyarrow",
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["code", "../alpha-research-core/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
