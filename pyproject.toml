[build-system]
requires = ["setuptools>=80,<81", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-platform"
version = "0.1.0"
description = "本地多市场量化研究平台。"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.136,<1",
  "httpx>=0.28,<1",
  "scipy>=1.18,<2",
  "statsmodels>=0.15,<0.16",
  "arch>=8,<9",
  "numpy>=2.3,<2.4",
  "pandas>=3.0,<4",
  "pyarrow>=24,<25",
  "pydantic>=2.13,<3",
  "psutil>=7.2,<8",
  "scikit-learn>=1.9,<2",
  "threadpoolctl>=3.5,<4",
  "xgboost>=3,<4",
  "lightgbm>=4.6,<5",
  "typer>=0.26,<1",
  "websockets>=16,<17",
]

[project.optional-dependencies]
dev = [
  "build>=1.5,<2",
  "matplotlib>=3.11,<4",
  "nbconvert>=7.17,<8",
  "ipykernel>=7.3,<8",
  "pytest>=9,<10",
  "ruff>=0.15,<0.16",
]

[project.scripts]
qrp = "quant_research_platform.interfaces.cli.commands:main"
qrp-private = "quant_research_platform.interfaces.private_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "--import-mode=importlib",
  "--strict-markers",
]
markers = [
  "guardrails: tests that enforce approved safety and scope boundaries",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
