[project]
name = "quant-research-platform"
version = "0.1.0"
description = "Local multi-market quantitative research platform."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.136,<1",
  "numpy>=2.3,<2.4",
  "pandas>=3.0,<4",
  "pyarrow>=24,<25",
  "pydantic>=2.13,<3",
  "psutil>=7.2,<8",
  "scikit-learn>=1.9,<2",
  "xgboost>=3,<4",
  "lightgbm>=4.6,<5",
  "typer>=0.26,<1",
  "uvicorn>=0.49,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.15,<0.16",
  "pytest-cov>=7,<8",
  "coverage>=7.14,<8",
  "hypothesis>=6.155,<7",
  "httpx>=0.28,<1",
]

[project.scripts]
qrp = "quant_research_platform.interfaces.cli.commands:main"
qrp-private = "quant_research_platform.interfaces.private_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--import-mode=importlib", "-m", "not requires_local_data"]
markers = [
  "contract: tests that lock current data, report, handoff, and API contracts",
  "architecture: tests that enforce owner-layer and import-boundary rules",
  "privacy: tests that enforce REVIEW_SAFE safety contracts",
  "guardrails: tests that enforce approved safety and scope boundaries",
  "integration: tests that exercise real IO, subprocess, git, or package-build paths",
  "mutation: tests that mutate package, manifest, sidecar, source-tree, or hostile-input artifacts",
  "slow: tests that are materially slower than the fast path",
  "performance: profiling, benchmark, or runtime/memory tests",
  "requires_local_data: tests that require local-only data or local/private environment state",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.coverage.run]
branch = true
source = ["src/quant_research_platform"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
