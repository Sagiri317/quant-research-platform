[project]
name = "quant-research-platform"
version = "0.1.0"
description = "Local multi-market quantitative research platform."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "numpy",
  "pandas",
  "pyarrow",
  "pydantic",
  "scikit-learn",
  "typer",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "pytest-cov",
  "coverage",
  "hypothesis",
]

[project.scripts]
qrp = "quant_research_platform.interfaces.cli.commands:main"
qrp-private = "quant_research_platform.interfaces.private_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.coverage.run]
branch = true
source = ["src/quant_research_platform"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
